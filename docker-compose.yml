# Qdrant server for the protein-function vector store.
#
#     docker compose up -d qdrant
#     curl localhost:6333/readyz
#
# This is what qdrant_collection_build's restore_to_server writes into, and what
# the MCP toolkit serves from. Until it is up, that task fails with
# "[Errno 111] Connection refused" -- there is no fallback, by design: silently
# restoring into an embedded folder instead would leave the application querying
# a store nothing ever promoted into.
#
# Pinned to v1.19.1 to match qdrant-client==1.19.1 in requirements.txt. The
# client tolerates a version skew but warns; keeping them equal removes the
# question. Bump both together.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: qdrant
    restart: unless-stopped
    # 127.0.0.1-bound on purpose. A bare "6333:6333" publishes on 0.0.0.0 --
    # every interface, including the LAN -- which with no API key means an
    # unauthenticated store anyone routable can read and write. Prefixing the
    # host IP is what actually makes the "localhost only" claim below true.
    ports:
      - "127.0.0.1:${QDRANT_REST_PORT:-6333}:6333"   # REST -- open_client uses prefer_grpc=False
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC, for anything that wants it later
    volumes:
      # A named volume, not a bind mount into data/. The collections are
      # reproducible from qdrant_export/ via `store.py restore`, so this is a
      # cache rather than a source of truth -- and keeping it out of the repo
      # tree means a stray `git clean` or a data/ wipe cannot take the live
      # store with it.
      - qdrant_storage:/qdrant/storage
    environment:
      # Structured logs, so an alias flip during restore_to_server is greppable.
      QDRANT__LOG_LEVEL: INFO
      QDRANT__SERVICE__ENABLE_TLS: "false"
      # No API key, which is only safe because the ports above are bound to
      # 127.0.0.1. If you ever widen those to 0.0.0.0, set
      # QDRANT__SERVICE__API_KEY here and QDRANT_API_KEY in .env to match --
      # the DAG already reads the latter and passes it to open_client().
    healthcheck:
      # /readyz rather than /healthz: healthz answers as soon as the process is
      # alive, readyz waits until collections are actually loadable, which is the
      # condition restore_to_server needs.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- one-shot: recover collections from shipped snapshots -----------------
  #
  #     docker compose --profile load run --rm qdrant-load
  #
  # The Qdrant counterpart to neo4j-load, and the reason a consumer needs no
  # Python: ship data/qdrant/snapshots/*.snapshot next to the compose file and
  # this restores them over the API. Unlike neo4j-load the server stays UP --
  # Qdrant recovers into a live server, so there is no stop/start dance.
  #
  # Re-runnable: recover replaces the collection, so refreshing a consumer's
  # data is this command again rather than `down -v`. That is strictly better
  # than the boot-time `--snapshot` flag, which is ignored once the storage
  # volume already holds the collection.
  #
  # To PRODUCE a snapshot, use qdrant_collection_build's snapshot_collections
  # task, or by hand from the host:
  #   curl -X POST localhost:6333/collections/<name>/snapshots
  #   curl -O localhost:6333/collections/<name>/snapshots/<returned-name>
  # There is no dump profile here, unlike neo4j-dump: producing happens on the
  # machine that has the repo, while loading must work with Docker alone.
  #
  # NOTE these land as REAL collections on the logical names. That is correct
  # for a fresh install but would block the alias on a host that runs
  # qdrant_collection_build -- see restore_to_server, which refuses in exactly
  # that case. Do not run this on the ETL host.
  qdrant-load:
    profiles: ["load"]
    image: curlimages/curl:8.11.1
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      # The shipped snapshots. Read-only, and mounted HERE rather than on the
      # server, because the upload reads the file client-side. The directory
      # must EXIST before `up`: Docker creates a missing bind source as root,
      # and then nothing but root can write into it.
      - ./data/qdrant/snapshots:/snapshots:ro
    entrypoint: ["/bin/sh", "-c"]
    # One physical line. A YAML folded scalar (>) only joins lines at a UNIFORM
    # indent -- indent a continuation further and the newline is kept literal,
    # which would hand /bin/sh `-H 'Content-Type...'` as its own command.
    # Uploaded as multipart, NOT recovered from a file:// location. Qdrant
    # refuses (403) a file:// path outside its own configured snapshots
    # directory, so that route would force the server to bind-mount this
    # directory read-write and then write root-owned 0600 files into the repo
    # tree. Uploading keeps the mount here, on the throwaway loader, read-only.
    # priority=snapshot makes the snapshot's data win over whatever is already
    # in the collection, which is the point of a restore.
    #
    # Picks the NEWEST <collection>-v<timestamp>.snapshot. The version is
    # YYYYMMDDHHMMSS, so plain lexicographic sort is time order -- no date
    # parsing in sh. To roll back, delete the newest file and re-run; to pin a
    # specific build, leave only that one in the directory.
    command:
      - 'for c in function_records function_chunks; do f=$$(ls -1 /snapshots/$$c-v*.snapshot 2>/dev/null | sort | tail -1); if [ -z "$$f" ]; then echo "no $$c-v*.snapshot in /snapshots"; exit 1; fi; echo "uploading $$f -> $$c"; curl -fsS -X POST "http://qdrant:6333/collections/$$c/snapshots/upload?priority=snapshot" -F "snapshot=@$$f" || exit 1; echo; done'

  # --- Neo4j: the serving replica of the graph the ETL builds ---------------
  #
  # PERSISTENCE, since that is the whole question: the graph lives in the
  # neo4j_data named volume, NOT in the dump. Load the dump once; the volume
  # keeps it across `docker compose stop/start/restart/down` and across reboots.
  # Only `docker compose down -v` destroys it -- that is the command to never
  # type by reflex. The loader below is profile-gated precisely so an ordinary
  # `up` cannot re-import and undo whatever the server has done since.
  neo4j:
    image: neo4j:5.19.0-community
    container_name: neo4j
    restart: unless-stopped
    # Loopback-only, same reasoning as Qdrant above -- doubly so with auth
    # disabled. Every user runs their own copy, so the defaults are the plain
    # ports a fresh machine expects.
    #
    # Override only where something already owns them. On the ETL host Neo4j
    # Desktop holds 7687 -- that is where the ETL writes, and STOP DATABASE
    # during a dump stops the database, not the listener, so it stays taken
    # for the whole dump. There, set NEO4J_BOLT_PORT=7688 and a matching
    # NEO4J_CONTAINER_URI in .env rather than editing this file.
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"   # HTTP / Browser
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt
    volumes:
      - neo4j_data:/data      # <- the database itself. This is the persistence.
      - neo4j_logs:/logs
      - ./data/neo4j/dumps:/dumps    # where the snapshot DAG drops neo4j.dump
    environment:
      # Auth off. Defensible ONLY because the ports above are 127.0.0.1-bound:
      # nothing off this machine can reach Bolt or the Browser. Note this has
      # no bearing on the Desktop instance the ETL writes to, which keeps its
      # own password -- the two servers share no credentials.
      #
      # Only applied when /data is EMPTY. Once the volume has a system database
      # this is ignored, including after a dump load, since the dump covers the
      # `neo4j` database and not `system`. Change it before the first start, or
      # not at all -- afterwards it takes `neo4j-admin dbms set-initial-password`
      # or a volume wipe.
      NEO4J_AUTH: none
      # Community, not Enterprise -- no licence to accept. Confirmed viable:
      # the source store is record-aligned-1.1 (db.format=aligned), which both
      # editions read, and every constraint is plain UNIQUENESS. Had Desktop
      # used Enterprise's default `block` format, or node-key / property-
      # existence constraints, a load here would have been impossible.
      # What Community costs: no online backup (`neo4j-admin database backup`),
      # no database aliases, so no zero-downtime swap like Qdrant's.
      # _upsert_annotation_edges uses apoc.periodic.iterate, so the ETL cannot
      # write to this container without APOC. Serving reads do not need it.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # --- one-shot: import data/neo4j/dumps/neo4j.dump into the volume ---------
  #
  #     docker compose stop neo4j
  #     docker compose --profile load run --rm neo4j-load
  #     docker compose start neo4j
  #
  # The `profiles` key is what keeps this out of a plain `docker compose up`.
  # Without it, depends_on/service_completed_successfully would re-import the
  # dump on every single start -- which is exactly the behaviour to avoid.
  # The server must be stopped: both mount /data and neo4j-admin needs the
  # store to itself.
  neo4j-load:
    profiles: ["load"]
    image: neo4j:5.19.0-community
    volumes:
      - neo4j_data:/data
      - ./data/neo4j/dumps:/dumps:ro
    entrypoint:
      - neo4j-admin
      - database
      - load
      - neo4j                             # the dump must be named neo4j.dump
      - --from-path=/dumps
      - --overwrite-destination=true
      - --verbose

  # --- one-shot: dump the container's graph back out ------------------------
  #
  #     docker compose stop neo4j
  #     docker compose --profile dump run --rm neo4j-dump
  #     docker compose start neo4j
  #
  # Once the ETL writes to this container rather than to Desktop, this is what
  # the snapshot DAG calls on neo4j://kgml_complete.
  #
  # PERMISSIONS, the same trap neo4j_snapshot.dump_source hit: the entrypoint
  # runs neo4j-admin as uid 7474, and ./data/neo4j/dumps is owned by whoever
  # cloned the repo, so the dump fails with "AccessDeniedException: /dumps".
  # The DAG solves it with --user $(id -u):$(id -g) because it reads Desktop's
  # store off /mnt/c, which is that user's own files. This service cannot copy
  # that: it reads the neo4j_data volume, which belongs to 7474. Make the host
  # directory group- or world-writable before using this path. Enterprise also has
  # `neo4j-admin database backup`, which runs against a LIVE server over port
  # 6362 and needs no stop at all -- prefer that if you keep the Enterprise
  # licence on the SOURCE. Community cannot online-backup, hence the stop.
  neo4j-dump:
    profiles: ["dump"]
    image: neo4j:5.19.0-community
    volumes:
      - neo4j_data:/data
      - ./data/neo4j/dumps:/dumps
    entrypoint:
      - neo4j-admin
      - database
      - dump
      - neo4j
      - --to-path=/dumps
      - --overwrite-destination=true
      - --verbose

volumes:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:
